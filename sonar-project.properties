sonar.organization=migueldonaire
sonar.projectKey=migueldonaire_devops-codigo

# Qué se analiza y qué no
sonar.sources=.
sonar.exclusions=node_modules/**,tests/**,k8s/**,eslint.config.mjs
sonar.tests=tests

# Dónde está el informe de cobertura de los tests
sonar.javascript.lcov.reportPaths=lcov.info

# Evitar que se cuente la cobertura de los tests
sonar.coverage.exclusions=**

# Esperar al Quality Gate y fallar si no se cumple
sonar.qualitygate.wait=true
