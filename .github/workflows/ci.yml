# Pipeline de pull request (sesiones 01, 02, 03 y 06)
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Sonar necesita el historial completo

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: ¿Has subido la versión?
        if: github.event_name == 'pull_request'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git rev-parse "v$VERSION" > /dev/null 2>&1; then
            echo "::warning::La versión $VERSION ya existe. Si tu PR cambia algo para los usuarios, súbela en package.json."
          fi

      - name: Build de la imagen Docker
        run: docker build -t web:ci .

      - name: Escanear la imagen con Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: web:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Análisis con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Buscar secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
